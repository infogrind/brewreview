[project]
name = "brewreview"
version = "0.1.0"
description = "Interactively review installed Homebrew formulae and remove unneeded ones"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Marius Kleiner", email = "kleiner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
brewreview = "brewreview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
